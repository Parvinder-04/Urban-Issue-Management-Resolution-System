# Alembic configuration for UIMRS.
#
# The database URL is never hard-coded here. ``backend/alembic/env.py`` resolves
# it from the application configuration (``DATABASE_URL`` environment variable,
# or the documented local-development default) unless a caller supplies an
# explicit URL through ``Config.attributes["database_url"]`` (used by the test
# suite and by ``scripts/migrate_database.py``).
#
# Run migrations from the project root:
#   backend/venv/Scripts/python.exe scripts/migrate_database.py
# or inspect them with the standard CLI:
#   backend/venv/Scripts/alembic.exe current
#   backend/venv/Scripts/alembic.exe history

[alembic]
script_location = backend/alembic
prepend_sys_path = backend
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
